name: Build artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    permissions:
      # Creating the release and uploading its asset on a tag.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # pack.ps1 runs `npx --yes @anthropic-ai/mcpb@<pinned version> validate` when npx is on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pack
        run: pwsh packaging/pack.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: roslyn-mcp-mcpb
          path: artifacts/*.mcpb
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.mcpb
          fail_on_unmatched_files: true
